services:
  cors:
    image: itcreator/argentum-toolkit-cors-dev
    build:
      context: ../../..
      dockerfile: devops/docker/cors-dev/Dockerfile
    depends_on:
      - api
    volumes:
      - ../../../devops/docker/cors-dev/config/nginx.conf:/etc/nginx/conf.d/default.conf
      - ../../../var/cert/api:/etc/nginx/cert
    ports:
      - "8082:80"
      - "8443:443"
