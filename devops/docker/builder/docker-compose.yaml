services:
  builder:
    image: itcreator/argentum-toolkit-rs-dev
    build:
      context: ../../..
      dockerfile: devops/docker/rust/Dockerfile
    environment:
      - AG_GITHUB_CLIENT_ID
      - AG_GOOGLE_CLIENT_ID
      - AG_OIDC_REDIRECT_URL
      - AG_USER_API_URL
      - AG_USER_ACCOUNT_API_URL
      - AG_OIDC_API_URL

    working_dir: /code
    volumes:
      - ../../..:/code
      - ../../../var/cargo/common:/usr/local/cargo/registry
