services:
  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8083:8080"
    volumes:
      - ../../..:/usr/share/nginx/html/doc
    environment:
      URLS: "[
                { url: 'doc/argentum_user_account/rest/api-spec/openapi.yaml', name: 'User Account'},
                { url: 'doc/argentum_user/rest/api-spec/openapi.yaml', name: 'User'},
            ]"
