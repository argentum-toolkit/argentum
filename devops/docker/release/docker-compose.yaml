services:
  release.fe:
    build:
      context: ../../..
      dockerfile: devops/docker/release/Dockerfile
      args:
        - RELEASE_PATH=${FE_RELEASE_PATH}
    environment:
      - AG_GITHUB_CLIENT_ID=${AG_GITHUB_CLIENT_ID}
      - AG_GOOGLE_CLIENT_ID=${AG_GOOGLE_CLIENT_ID}
      - AG_OIDC_REDIRECT_URL=${AG_OIDC_REDIRECT_URL}
      - PORT=${PORT:-8080} #Expose in Dockerfile
      - IP=${IP:-0.0.0.0}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<> /dev/tcp/127.0.0.1/${PORT:-8080}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  release.api:
    build:
      context: ../../..
      dockerfile: devops/docker/release/Dockerfile
      args:
        - RELEASE_PATH=${API_RELEASE_PATH}

    command: "/app/api"
    environment:
      - AG_OIDC_DATABASE_URL
      - AG_USER_ACCOUNT_DATABASE_URL
      - AG_USER_ACCOUNT_MEMBER_JWT_SECRET
      - AG_USER_DATABASE_URL
      - AG_USER_AGENT
      - AG_PRODUCT_NAME
      - AG_EMAIL_CONFIRMATION_FRONT_URL
      - AG_RESTORE_PASSWORD_FRONT_URL
      - AG_PASSWORD_MIN_LENGTH
      - AG_PASSWORD_COMPLEXITY_ENABLED
      - AG_CAPTCHA_ENABLED
      - AG_CAPTCHA_TURNSTILE_SECRET_KEY
      - AG_GITHUB_CLIENT_ID
      - AG_GITHUB_CLIENT_SECRET
      - AG_GOOGLE_CLIENT_ID
      - AG_GOOGLE_CLIENT_SECRET
      - AG_OIDC_REDIRECT_URL
      - TLS_CERT_FILE
      - TLS_KEY_FILE

    # The api binds 0.0.0.0:8088 (see examples/api-app/src/api/di.rs)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<> /dev/tcp/127.0.0.1/8088"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    depends_on:
      service.user.db:
        condition: service_healthy
      service.user_account.db:
        condition: service_healthy
      service.oidc.db:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"
