services:
  api:
    image: itcreator/argentum-toolkit-rs-dev
    build:
      context: ../../..
      dockerfile: devops/docker/rust/Dockerfile

    privileged: true
    tty: true
    stdin_open: true
    # command: ["tail", "-f", "/dev/null"]
    # command: perf record -g --call-graph dwarf cargo run --bin api --release
    command: cargo run --bin api #--release
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - CARGO_PROFILE_RELEASE_DEBUG=2
      - AG_OIDC_DATABASE_URL
      - AG_USER_ACCOUNT_DATABASE_URL
      - AG_USER_ACCOUNT_MEMBER_JWT_SECRET
      - AG_USER_DATABASE_URL
      - AG_USER_AGENT
      - AG_PRODUCT_NAME
      - AG_EMAIL_CONFIRMATION_FRONT_URL
      - AG_RESTORE_PASSWORD_FRONT_URL
      - AG_PASSWORD_MIN_LENGTH
      - AG_PASSWORD_COMPLEXITY_ENABLED
      - AG_GITHUB_CLIENT_ID
      - AG_GITHUB_CLIENT_SECRET
      - AG_GOOGLE_CLIENT_ID
      - AG_GOOGLE_CLIENT_SECRET
      - AG_OIDC_REDIRECT_URL
      - TLS_CERT_FILE
      - TLS_KEY_FILE

    depends_on:
      service.user.db:
        condition: service_healthy
      service.user_account.db:
        condition: service_healthy
      service.oidc.db:
        condition: service_healthy
    working_dir: /code/examples/api-app
    ports:
      - "8088:8088"
    volumes:
      - ../../..:/code
      - ../../../var/cargo/common:/usr/local/cargo/registry
    extra_hosts:
      - "host.docker.internal:host-gateway"
