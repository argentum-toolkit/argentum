services:
  service.oidc.db:
    image: "postgres:18.0-alpine"
    environment:
      - POSTGRES_DB=${POSTGRES_DB_FOR_ARGENTUM_OIDC}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_LOGGING=verbose
    volumes:
      - db-oidc:/var/lib/postgresql

volumes:
  db-oidc:
