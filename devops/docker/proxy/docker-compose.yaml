services:
  proxy:
    image: itcreator/argentum-toolkit-release
    build:
      context: ../../..
      dockerfile: devops/docker/proxy/Dockerfile
    depends_on:
      - release.api
    environment:
      - FE_HOST=release.fe
      - FE_PORT=8080
      - API_HOST=release.api
      - API_PORT=8088
    volumes:
      - ../../../var/cert/api:/etc/nginx/cert
    ports:
      - "443:443"
