openapi: 3.1.0

info:
  title: Argentum User Account component API
  version: 0.4.0-dev
  description: User Account API
  license:
    name: LGPL-3.0
    identifier: LGPL-3.0

  contact:
    url: https://gitlab.com/argentum-toolkit/argentum

servers:
  - url: http://localhost:{port}/{basePath}
    description: Dev API Server with CORS
    variables:
      port:
        enum:
          - "8082"
        default: "8082"
      basePath:
        default: api/v1
  - url: http://localhost:{port}/{basePath}
    description: The production API server
    variables:
      port:
        enum:
          - "80"
          - "8080"
        default: "8080"
      basePath:
        default: api/v1

externalDocs:
  description: Find more info here
  url: https://gitlab.com/argentum-toolkit/argentum
paths:
  /user-account/guest-registration:
    post:
      summary: Guest registers
      description: Guest registers without any data
      tags:
        - guest
      operationId: GuestRegisters
      responses:
        "201":
          $ref: "./response.oas.yaml#/components/responses/GuestRegisteredSuccessfully"

  /user-account/register:
    post:
      summary: Member registers with password
      description: Member registers with email and password
      tags:
        - user-account
      operationId: MemberRegistersWithPassword
      security:
        - bearerAuth: []
      requestBody:
        $ref: "./request.oas.yaml#/components/requestBodies/RegistrationWithPasswordRequestBody"
      responses:
        "201":
          $ref: "./response.oas.yaml#/components/responses/MemberRegisteredSuccessfully"
        "400":
          $ref: "../../argentum_standard/api-doc/response.oas.yaml#/components/responses/400"
        "409":
          $ref: "../../argentum_standard/api-doc/response.oas.yaml#/components/responses/409"
      x-ag-form:
        submit-label: "Sign Up"

  /user-account/password-login:
    post:
      summary: Login as an member
      description: Login as an member
      tags:
        - user-account
      operationId: MemberLoginsWithPassword
      security:
        - bearerAuth: []
      requestBody:
        $ref: "./request.oas.yaml#/components/requestBodies/LoginWithPasswordRequestBody"

      responses:
        "200":
          $ref: "./response.oas.yaml#/components/responses/MemberLoggedInSuccessfully"
        "400":
          $ref: "../../argentum_standard/api-doc/response.oas.yaml#/components/responses/400"
        "401":
          $ref: "../../argentum_standard/api-doc/response.oas.yaml#/components/responses/401"
      x-ag-form:
        submit-label: "Sign In"

  /user-account/restore-password/token-request:
    post:
      summary: Guest requests restore password token
      description: Requested token and link will be sent to email
      tags:
        - user-account
      operationId: GuestRequestsRestoreToken
      security:
        - bearerAuth: []
      requestBody:
        $ref: "./request.oas.yaml#/components/requestBodies/RequestRestoreTokenRequestBody"

      responses:
        "200":
          $ref: "../../argentum_standard/api-doc/response.oas.yaml#/components/responses/EmptyOk"
        "400":
          $ref: "../../argentum_standard/api-doc/response.oas.yaml#/components/responses/400"
        "401":
          $ref: "../../argentum_standard/api-doc/response.oas.yaml#/components/responses/401"

  /user-account/restore-password/change-password:
    post:
      summary: Member with token changes his password
      description: Final step of restoring password process
      tags:
        - user-account
      operationId: GuestWithTokenChangesPassword
      security:
        - bearerAuth: []
      requestBody:
        $ref: "./request.oas.yaml#/components/requestBodies/ChangePasswordRequestBody"

      responses:
        "200":
          $ref: "../../argentum_standard/api-doc/response.oas.yaml#/components/responses/EmptyOk"
        "400":
          $ref: "../../argentum_standard/api-doc/response.oas.yaml#/components/responses/400"
        "401":
          $ref: "../../argentum_standard/api-doc/response.oas.yaml#/components/responses/401"

  /user-account/email-verification:
    post:
      description: Member sends email verification key
      operationId: MemberVerifiesEmail
      summary: New member verifies email address
      tags:
        - user-account
      security:
        - bearerAuth: []
      requestBody:
        $ref: "./request.oas.yaml#/components/requestBodies/EmailVerificationRequestBody"
      responses:
        "200":
          $ref: "../../argentum_standard/api-doc/response.oas.yaml#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      in: header

tags:
  - name: guest
    description: Managing of the guests

  - name: user-account
    description: Managing of the user account
#security:
#  - bearerAuth: []
