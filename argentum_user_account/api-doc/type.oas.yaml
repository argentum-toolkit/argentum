openapi: 3.1.0

info:
  title: User Account component's types (schemas)
  version: 0.4.0-dev
paths: {}

components:
  schemas:
    RegistrationWithPasswordSchema:
      type: object
      properties:
        email:
          type: string
          title: Email address
          format: email
          example: test-email@test-email.com
          x-ag-ui:
            id: email
            name: email
            weight: 10

        name:
          $ref: "../../argentum_user/api-doc/type.oas.yaml#/components/schemas/UserName"
        password:
          type: string
          title: Password
          format: password
          example: secure-password
          x-ag-ui:
            id: password
            name: password
            weight: 30
        terms:
          type: boolean
          title: By creating account means you agree to the Terms and Conditions, and our Privacy Policy
          example: "false"
          x-ag-ui:
            id: terms
            name: terms
            weight: 40
      required:
        - email
        - name
        - password
        - terms

    GuestRegistrationResult:
      type: object
      properties:
        guest_id:
          type: string
          format: uuid
          example: c8cabaac-8359-463a-9cce-954eff31e063
        token:
          type: string
          example: token-example
      required:
        - guest_id
        - token

    RegistrationWithPasswordResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 20c31ece-c78c-45d6-9ef3-8452e8eea571
      required:
        - id

    LoginResult:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          example: dd7ea831-ad64-429f-9839-a44c84c74550
        token:
          type: string
          example: token-example
      required:
        - user_id
        - token

    LoginWithPasswordSchema:
      type: object
      properties:
        email:
          type: string
          title: Email
          format: email
          example: test-email@test-email.com
        password:
          type: string
          title: Password
          format: password
          example: secure-password
          x-ag-ui:
            id: password
            name: password
      required:
        - email
        - password

    RequestRestoreTokenSchema:
      type: object
      properties:
        email:
          type: string
          format: email
          example: test-email@test-email.com
      required:
        - email

    ChangePasswordSchema:
      type: object
      properties:
        token:
          type: string
          example: token-example
        password:
          type: string
          format: password
          example: secure-password
      required:
        - token
        - password

    EmailVerificationSchema:
      type: object
      properties:
        key:
          example: abc123efg567
          type: string
      required:
        - key

