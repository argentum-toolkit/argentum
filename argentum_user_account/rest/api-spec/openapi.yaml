openapi: 3.1.0
info:
  contact:
    url: https://gitlab.com/argentum-toolkit/argentum
  description: User Account API
  license:
    name: LGPL-3.0-or-later
  title: Argentum User Account component API
  version: 0.4.0-dev
externalDocs:
  description: Find more info here
  url: https://gitlab.com/argentum-toolkit/argentum
servers:
- description: Dev API Server with CORS
  url: http://localhost:{port}/{basePath}
  variables:
    basePath:
      default: api/v1
    port:
      default: '8082'
      enum:
      - '8082'
      - '8080'
- description: Dev HTTP/2 API Server with CORS
  url: https://localhost:{port}/{basePath}
  variables:
    basePath:
      default: api/v1
    port:
      default: '8443'
      enum:
      - '8443'
      - '8080'
- description: The production API server
  url: http://localhost:{port}/{basePath}
  variables:
    basePath:
      default: api/v1
    port:
      default: '8080'
      enum:
      - '80'
      - '8080'
tags:
- description: Managing of the guests
  name: guest
- description: Managing of the user account
  name: user-account
paths:
  /user-account/email-verification:
    post:
      description: Member sends email verification key
      operationId: MemberVerifiesEmail
      tags:
      - user-account
      security:
      - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/EmailVerificationRequestBody'
      summary: New member verifies email address
      responses:
        '200':
          $ref: '#/components/responses/EmptyOk'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
  /user-account/guest-registration:
    post:
      description: Guest registers without any data
      operationId: GuestRegisters
      tags:
      - guest
      summary: Guest registers
      responses:
        '201':
          $ref: '#/components/responses/GuestRegisteredSuccessfully'
  /user-account/password-login:
    post:
      description: Login as an member
      operationId: MemberLoginsWithPassword
      tags:
      - user-account
      security:
      - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/LoginWithPasswordRequestBody'
      summary: Login as an member
      responses:
        '200':
          $ref: '#/components/responses/MemberLoggedInSuccessfully'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
      x-ag-form:
        submit-label: Sign In
  /user-account/register:
    post:
      description: Member registers with email and password
      operationId: MemberRegistersWithPassword
      tags:
      - user-account
      security:
      - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/RegistrationWithPasswordRequestBody'
      summary: Member registers with password
      responses:
        '201':
          $ref: '#/components/responses/MemberRegisteredSuccessfully'
        '400':
          $ref: '#/components/responses/400'
        '409':
          $ref: '#/components/responses/409'
      x-ag-form:
        submit-label: Sign Up
  /user-account/restore-password/change-password:
    post:
      description: Final step of restoring password process
      operationId: GuestWithTokenChangesPassword
      tags:
      - user-account
      security:
      - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ChangePasswordRequestBody'
      summary: Member with token changes his password
      responses:
        '200':
          $ref: '#/components/responses/EmptyOk'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
  /user-account/restore-password/token-request:
    post:
      description: Requested token and link will be sent to email
      operationId: GuestRequestsRestoreToken
      tags:
      - user-account
      security:
      - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/RequestRestoreTokenRequestBody'
      summary: Guest requests restore password token
      responses:
        '200':
          $ref: '#/components/responses/EmptyOk'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
components:
  requestBodies:
    ChangePasswordRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChangePasswordSchema'
      description: Required data to change password with token
      required: true
    EmailVerificationRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailVerificationSchema'
      description: Required data for email verification
      required: true
    LoginWithPasswordRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginWithPasswordSchema'
      description: Required data to login with email and password
      required: true
    RegistrationWithPasswordRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationWithPasswordSchema'
      description: Data required to register with email and password
      required: true
    RequestRestoreTokenRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RequestRestoreTokenSchema'
      description: Required data to get restore password token
      required: true
  schemas:
    ChangePasswordSchema:
      required:
      - token
      - password
      properties:
        token:
          example: token-example
          type: string
        password:
          example: secure-password
          type: string
          format: password
      type: object
    EmailVerificationSchema:
      required:
      - key
      properties:
        key:
          example: abc123efg567
          type: string
      type: object
    EmptyResponse:
      title: Empty response
      type: null
    GuestRegistrationResult:
      required:
      - guest_id
      - token
      properties:
        guest_id:
          example: c8cabaac-8359-463a-9cce-954eff31e063
          type: string
          format: uuid
        token:
          example: token-example
          type: string
      type: object
    LoginResult:
      required:
      - user_id
      - token
      properties:
        user_id:
          example: dd7ea831-ad64-429f-9839-a44c84c74550
          type: string
          format: uuid
        token:
          example: token-example
          type: string
      type: object
    LoginWithPasswordSchema:
      required:
      - email
      - password
      properties:
        email:
          example: test-email@test-email.com
          title: Email
          type: string
          format: email
        password:
          example: secure-password
          title: Password
          type: string
          format: password
          x-ag-ui:
            id: password
            name: password
            wrapper: none
            optional-style: none
      type: object
    ProblemDetail:
      title: Schema for error response
      description: RFC 7807 Problem Details for HTTP APIs
      required:
      - status
      - title
      properties:
        status:
          example: '401'
          maximum: 599.0
          minimum: 400.0
          type: integer
          format: int32
        title:
          example: Bad Request
          type: string
        type:
          example: about:blank
          type: string
        detail:
          type: string
        body:
          $ref: '#/components/schemas/Violation'
      type: object
    RegistrationWithPasswordResult:
      required:
      - id
      properties:
        id:
          example: 20c31ece-c78c-45d6-9ef3-8452e8eea571
          type: string
          format: uuid
      type: object
    RegistrationWithPasswordSchema:
      required:
      - email
      - name
      - password
      - terms
      properties:
        email:
          example: test-email@test-email.com
          title: Email address
          type: string
          format: email
          x-ag-ui:
            id: email
            name: email
            weight: 10
            wrapper: none
            optional-style: none
        name:
          $ref: '#/components/schemas/UserName'
        password:
          example: secure-password
          title: Password
          type: string
          format: password
          x-ag-ui:
            id: password
            name: password
            weight: 30
            wrapper: none
            optional-style: none
        terms:
          example: 'false'
          title: By creating account means you agree to the Terms and Conditions, and our Privacy Policy
          type: boolean
          x-ag-ui:
            id: terms
            name: terms
            weight: 40
            wrapper: none
            optional-style: none
      type: object
    RequestRestoreTokenSchema:
      required:
      - email
      properties:
        email:
          example: test-email@test-email.com
          type: string
          format: email
      type: object
    UserName:
      required:
      - first
      properties:
        first:
          example: Winston
          title: First Name
          maxLength: 255
          minLength: 1
          type: string
          x-ag-ui:
            id: user_first_name
            name: user_first_name
            wrapper: none
            optional-style: none
        last:
          example: Marko
          title: Last Name
          maxLength: 255
          minLength: 1
          type: string
          x-ag-ui:
            id: user_last_name
            name: user_last_name
            wrapper: none
            optional-style: none
        additional:
          title: Additional name
          maxLength: 255
          minLength: 1
          type: string
          x-ag-ui:
            id: user_additional_name
            name: user_additional_name
            weight: 100
            wrapper: none
            optional-style: none
      type: object
    Violation:
      properties:
        errors:
          $ref: '#/components/schemas/ViolationErrors'
        items:
          $ref: '#/components/schemas/ViolationItems'
      type: object
    ViolationErrors:
      items:
        type: string
      type: array
    ViolationItems:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Violation'
  responses:
    '400':
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
      description: Bad request
    '401':
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
      description: Unauthorized
    '409':
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
      description: Conflict
    EmptyOk:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmptyResponse'
      description: OK
    GuestRegisteredSuccessfully:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GuestRegistrationResult'
      description: Created
    MemberLoggedInSuccessfully:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginResult'
      description: OK
    MemberRegisteredSuccessfully:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationWithPasswordResult'
      description: Created
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
      name: ''
      in: header
      open_id_connect_url: ''
