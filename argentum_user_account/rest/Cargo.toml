[package]
name = "argentum_user_account_rest"
description = "Argentum User Account component API"
version = "0.3.0-dev"
license = "BSD-3-Clause"
edition = "2021"

readme = "readme.adoc"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
client = ["dep:reqwest"]
server = []
ui = ["dep:dioxus", "dep:dioxus-logger", "dep:argentum_standard_infrastructure"]

[dependencies]
argentum_rest_infrastructure = { path = "../../argentum_rest/infrastructure", version = ">=0.3.0-dev,<0.4.0" }
argentum_standard_business = { path = "../../argentum_standard/business", version = ">=0.3.0-dev,<0.4.0" }
argentum_standard_infrastructure = { path = "../../argentum_standard/infrastructure", version = ">=0.3.0-dev,<0.4.0", optional = true }
argentum_user_business = { path = "../../argentum_user/business", version = ">=0.3.0-dev,<0.4.0" }

async-trait = "0.1.*"
chrono = "0.4.*"
dioxus = { version = "0.5", features = ["fullstack", "router"], optional = true }
dioxus-logger = { version = "0.5", optional = true }
erased-serde = "0.3.*"
hyper = { version = "1.0.0", features = ["full"] }
regex = "1.10.*"
reqwest = { version = "0.12", features = ["json"], optional = true }
serde = { version = "1.0.*", features = ["derive"] }
serde_json = "1.0.*"
serde_valid = "0.16.*"
uuid = {version = "1.5.*", features = ["serde", "v4"]}
