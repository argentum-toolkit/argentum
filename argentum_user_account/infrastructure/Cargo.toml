[package]
name = "argentum_user_account_infrastructure"
description = "Infrastructure layer of user account component"
version = "0.4.0-dev"
authors = ["Vital Leshchyk <VitalLeshchyk@gmail.com>"]
license = "LGPL-3.0-or-later"
edition = "2024"
homepage = "https://gitlab.com/argentum-toolkit/argentum"
repository = "https://gitlab.com/argentum-toolkit/argentum"
documentation = "https://gitlab.com/argentum-toolkit/argentum"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
server = []

[dependencies]
anyhow = "1.*"
argentum_db_infrastructure = { path = "../../argentum_db/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_encryption_business = { path = "../../argentum_encryption/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_encryption_infrastructure = { path = "../../argentum_encryption/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_event_business = { path = "../../argentum_event/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_notification_business = { path = "../../argentum_notification/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_log_business = { path = "../../argentum_log/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_rest_infrastructure = { path = "../../argentum_rest/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_standard_business = { path = "../../argentum_standard/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_standard_infrastructure = { path = "../../argentum_standard/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_user_account_business = { path = "../business", version = ">=0.4.0-dev,<0.5.0" }
argentum_user_account_rest = { path = "../rest", version = ">=0.4.0-dev,<0.5.0", features = [
  "server",
] }
argentum_user_business = { path = "../../argentum_user/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_user_infrastructure = { path = "../../argentum_user/infrastructure", version = ">=0.4.0-dev,<0.5.0" }

async-trait = "0.1.*"
base64 = "0.22.*"
chrono = { version = "0.4.*", features = ["serde"] }
fastrand = "2.*"
futures = "0.3.*"

jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }

reqwest = { version = "0.12.*", features = ["json"] }

secrecy = "0.10.*"

serde = { version = "1.*", features = ["derive"] }
serde_json = "1.*"

sqlx = { version = "0.8.*", features = [
  "runtime-tokio",
  "tls-native-tls",
  "postgres",
  "uuid",
  "any",
  "chrono",
] }

# tokio = { version = "1.*", features = ["full"], optional = true }
tokio = { version = "1.*", features = ["full"] }
uuid = { version = "1.*", features = ["serde", "v4"] }
