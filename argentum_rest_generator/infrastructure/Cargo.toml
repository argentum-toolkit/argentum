[package]
name = "argentum_rest_generator_infrastructure"
description = "Argentum toolkit. REST generator. Infrastructure layer."
version = "0.4.0-dev"
authors = ["Vital Leshchyk <VitalLeshchyk@gmail.com>"]
license = "LGPL-3.0-or-later"
edition = "2024"
homepage = "https://gitlab.com/argentum-toolkit/argentum"
repository = "https://gitlab.com/argentum-toolkit/argentum"
documentation = "https://gitlab.com/argentum-toolkit/argentum"
readme = "README.md"

[dependencies]
convert_case = "0.8.*"
handlebars = "6.*"
http = "1.*"
hyper = { version = "1.*", features = ["full"] }
indexmap = { version = "2.*", features = ["serde"] }
serde = { version = "1.*", features = ["derive"] }
serde_json = "1.*"
serde_yaml_ng = "0.10.*"
reqwest = "0.12.*"

argentum_rest_infrastructure = { path = "../../argentum_rest/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_openapi_infrastructure = { path = "../../argentum_openapi/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_log_business = { path = "../../argentum_log/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_template_infrastructure = { path = "../../argentum_template/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
