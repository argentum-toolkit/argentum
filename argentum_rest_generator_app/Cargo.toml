[package]
name = "argentum_rest_generator_app"
description = "Argentum toolkit REST generator"
version = "0.3.0-dev"
authors = ["Vital Leshchyk <VitalLeshchyk@gmail.com>"]
license = "LGPL-3.0"
edition = "2021"
homepage = "https://gitlab.com/argentum-toolkit/argentum"
repository = "https://gitlab.com/argentum-toolkit/argentum"
documentation = "https://gitlab.com/argentum-toolkit/argentum"
readme = "readme.adoc"

[dependencies]
clap = { version = "4.4.*", features = ["derive"] }
convert_case = "0.6.*"
handlebars = "6.3.*"
http = "1.*"
hyper = { version = "1.*", features = ["full"] }
serde = { version = "1.0.*", features = ["derive"] }
serde_json = "1.0.*"
serde_yaml = "0.9.*"
reqwest = "^0.12"

argentum_rest_infrastructure = { path = "../argentum_rest/infrastructure", version = ">=0.3.0-dev,<0.4.0" }
argentum_openapi_infrastructure = { path = "../argentum_openapi/infrastructure", version = ">=0.3.0-dev,<0.4.0" }
argentum_log_business = { path = "../argentum_log/business", version = ">=0.3.0-dev,<0.4.0" }
argentum_log_infrastructure = { path = "../argentum_log/infrastructure", version = ">=0.3.0-dev,<0.4.0" }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
