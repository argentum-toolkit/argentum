[package]
name = "argentum_template_infrastructure"
description = "Argentum toolkit. Template component. Infrastructure layer."
version = "0.4.0-dev"
authors = ["Vital Leshchyk <VitalLeshchyk@gmail.com>"]
license = "LGPL-3.0"
edition = "2024"
homepage = "https://gitlab.com/argentum-toolkit/argentum"
repository = "https://gitlab.com/argentum-toolkit/argentum"
documentation = "https://gitlab.com/argentum-toolkit/argentum"
readme = "README.md"

[dependencies]
convert_case = "0.6.*"
handlebars = "6.3.*"
serde = { version = "1.0.*", features = ["derive"] }
serde_json = "1.0.*"


[dev-dependencies]
tempfile = "3"
