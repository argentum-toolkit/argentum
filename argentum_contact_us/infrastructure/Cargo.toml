[package]
name = "argentum_contact_us_infrastructure"
description = "Infrastructure layer of contact_us component"
version = "0.4.0-dev"
authors = ["Vital Leshchyk <VitalLeshchyk@gmail.com>"]
license = "LGPL-3.0-or-later"
edition = "2024"
repository = "https://gitlab.com/argentum-toolkit/argentum"
documentation = "https://gitlab.com/argentum-toolkit/argentum"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.*"

argentum_captcha_business = { path = "../../argentum_captcha/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_contact_us_rest = { path = "../rest", version = ">=0.4.0-dev,<0.5.0", features = [
  "server",
] }
argentum_rest_infrastructure = { path = "../../argentum_rest/infrastructure", version = ">=0.4.0-dev,<0.5.0", features = [
  "server",
] }
argentum_user_business = { path = "../../argentum_user/business", version = ">=0.4.0-dev,<0.5.0" }

argentum_db_infrastructure = { path = "../../argentum_db/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_log_business = { path = "../../argentum_log/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_standard_business = { path = "../../argentum_standard/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_standard_infrastructure = { path = "../../argentum_standard/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_contact_us_business = { path = "../business", version = ">=0.4.0-dev,<0.5.0" }

askama_escape = "0.13"
async-trait = "0.1.*"
jiff = { version = "1.*", features = ["serde"] }
jiff-sqlx = { version = "1.*", features = ["postgres"] }
lettre = "0.11.*"

sqlx = { version = "0.9.*", features = [
  "runtime-tokio",
  "tls-native-tls",
  "postgres",
  "uuid",
] }

tokio = { version = "1.*", features = ["full"] }
uuid = { version = "1.*", features = ["serde", "v4"] }
