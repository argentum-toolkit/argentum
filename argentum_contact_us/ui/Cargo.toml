[package]
name = "argentum_contact_us_ui"
description = "Argentum Contact Us component. UI"
version = "0.4.0-dev"
authors = ["Vital Leshchyk <VitalLeshchyk@gmail.com>"]
license = "LGPL-3.0-or-later"
edition = "2024"
repository = "https://gitlab.com/argentum-toolkit/argentum"
documentation = "https://gitlab.com/argentum-toolkit/argentum"

[dependencies]
argentum_contact_us_rest = { path = "../rest", version = ">=0.4.0-dev,<0.5.0", features = [
  "client",
  "ui",
] }
argentum_user_account_ui = { path = "../../argentum_user_account/ui", version = ">=0.4.0-dev,<0.5.0", optional = true }

dioxus = { version = "0.7.*", features = ["fullstack"] }

[features]
default = []
web = ["argentum_contact_us_rest/web", "argentum_user_account_ui/web"]
