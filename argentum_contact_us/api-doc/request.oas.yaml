openapi: 3.1.0

info:
  title: Contact Us component's request bodies
  version: 0.4.0-dev

paths: {}

components:
  requestBodies:
    GuestSendsMessageRequestBody:
      description: "Data required to send a message as a guest"
      required: true
      content:
        "application/json":
          schema:
            $ref: "type.oas.yaml#/components/schemas/GuestSendsMessageSchema"

    MemberSendsMessageRequestBody:
      description: "Data required to send a message as a logged-in member"
      required: true
      content:
        "application/json":
          schema:
            $ref: "type.oas.yaml#/components/schemas/MemberSendsMessageSchema"
