openapi: 3.1.0

info:
  title: Standard component's types (schemas)
  version: 0.3.0
paths: { }

components:
  schemas:
    ProblemDetail:
      title: Schema for error response
      description: "RFC 7807 Problem Details for HTTP APIs"
      required:
        - status
        - title
      type: object
      properties:
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          example: '401'
          # example: 401 will be parsed as int. It causes an error
          # https://play.rust-lang.org/?version=stable&mode=debug&edition=2021&gist=4930c626eb2d70a28db81c0352dcc797
        title:
          type: string
          example: "Bad Request"
        type:
          type: string
          example: "about:blank"
        detail: 
          type: string
        body: 
          $ref: "#/components/schemas/Violation"

    Violation:
      type: object
      properties:
        errors:
          $ref: "#/components/schemas/ViolationErrors"
        items:
          $ref: "#/components/schemas/ViolationItems"
    
    ViolationErrors:
      type: array
      items:
        type: string
        #TODO: examples

    ViolationItems:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/Violation"

    EmptyResponse:
      title: Empty response
      #TODO: add support of empty types

    DateRange:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
          example: 2022-10-17T09:28:31.220Z
        end:
          type: string
          format: date-time
          example: 2022-11-17T09:28:31.220Z
