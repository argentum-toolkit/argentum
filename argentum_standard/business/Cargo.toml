[package]
name = "argentum_standard_business"
description = "The business layer of standard component"
version = "0.4.0-dev"
authors = ["Vital Leshchyk <VitalLeshchyk@gmail.com>"]
license = "LGPL-3.0"
edition = "2024"
homepage = "https://gitlab.com/argentum-toolkit/argentum"
repository = "https://gitlab.com/argentum-toolkit/argentum"
documentation = "https://gitlab.com/argentum-toolkit/argentum"
readme = "README.md"

[dependencies]
chrono = { version = "0.4.*", features = ["serde"] }
fastrand = "2.*"
regex = "1.*"
compiletime-regex = "1.*"
thiserror = "2.*"
phonenumber = "0.3.*"
