openapi: 3.1.0

info:
  title: User component's types (schemas)
  version: 0.3.0-dev

paths: { }

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 20c31ece-c78c-45d6-9ef3-8452e8eea571
        email:
          type: string
          format: email
          example: test-email@test-email.com
        name:
          $ref: '#/components/schemas/UserName'
      required:
        - email
        - name

    UserName:
      type: object
      properties:
        first:
          type: string
          minLength: 1
          maxLength: 255
          example: Winston
          x-ag-ui:
              id: user_first_name
              name: user_first_name
              label: "First Name"
            #TODO: x-ag-type: 
        last:
          type: string
          minLength: 1
          maxLength: 255
          example: Marko
          x-ag-ui:
              id: user_last_name
              name: user_last_name
              label: "First Name"
        patronymic:
          type: string
          minLength: 1
          maxLength: 255
          x-ag-ui:
            id: user_patronymic
            name: user_patronymic
            label: "Patronymic"

      required:
        - first
  