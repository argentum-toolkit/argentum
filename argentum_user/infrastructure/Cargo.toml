[package]
name = "argentum_user_infrastructure"
description = "Business layer of user component"
version = "0.4.0-dev"
authors = ["Vital Leshchyk <VitalLeshchyk@gmail.com>"]
license = "LGPL-3.0-or-later"
edition = "2024"
homepage = "https://gitlab.com/argentum-toolkit/argentum"
repository = "https://gitlab.com/argentum-toolkit/argentum"
documentation = "https://gitlab.com/argentum-toolkit/argentum"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
server = ["dep:tokio"]

[dependencies]
async-trait = "0.1.*"

argentum_db_infrastructure = { path = "../../argentum_db/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_log_business = { path = "../../argentum_log/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_rest_infrastructure = { path = "../../argentum_rest/infrastructure", features = [
  "server",
], version = ">=0.4.0-dev,<0.5.0" }
argentum_standard_business = { path = "../../argentum_standard/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_standard_infrastructure = { path = "../../argentum_standard/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_user_business = { path = "../../argentum_user/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_user_rest = { path = "../../argentum_user/rest", features = [
  "server",
], version = ">=0.4.0-dev,<0.5.0" }

chrono = { version = "0.4.*", features = ["serde"] }

serde = { version = "1.*", features = ["derive"] }
sqlx = { version = "0.8.*", features = [
  "runtime-tokio",
  "tls-native-tls",
  "postgres",
  "uuid",
  "any",
  "chrono",
] }
thiserror = "2.*"
tokio = { version = "1.*", features = ["full"], optional = true }
uuid = { version = "1.*", features = ["serde", "v4"] }

reqwest = { version = "0.12.*", features = ["json"] }
serde_json = "1.*"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
