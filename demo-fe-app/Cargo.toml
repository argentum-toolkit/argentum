[package]
name = "demo-fe-app"
version = "0.4.0-dev"
authors = ["Vital Leshchyk <vitalleshchyk@gmail.com>"]
edition = "2024"
license = "LGPL-3.0"

resolver = "2"

[build-dependencies]
dotenvy = "0.15"

[dependencies]
argentum_oidc_rest = { path = "../argentum_oidc/rest", version = ">=0.4.0-dev,<0.5.0", features = [
    "client",
] }
argentum_oidc_ui = { path = "../argentum_oidc/ui", version = ">=0.4.0-dev,<0.5.0" }
argentum_rest_infrastructure = { path = "../argentum_rest/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_standard_business = { path = "../argentum_standard/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_standard_infrastructure = { path = "../argentum_standard/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_standard_ui = { path = "../argentum_standard/ui", version = ">=0.4.0-dev,<0.5.0", default-features = false }
argentum_user_account_rest = { path = "../argentum_user_account/rest", version = ">=0.4.0-dev,<0.5.0", features = [
    "client",
    "ui",
] }
argentum_user_account_ui = { path = "../argentum_user_account/ui", version = ">=0.4.0-dev,<0.5.0" }
argentum_user_rest = { path = "../argentum_user/rest", version = ">=0.4.0-dev,<0.5.0", features = [
    "client",
] }
argentum_user_ui = { path = "../argentum_user/ui", version = ">=0.4.0-dev,<0.5.0" }
async-trait = "0.1.*"

dotenvy = "0.15.*"

serde = { version = "1.*", features = ["derive"] }
serde_json = "1.*"

dioxus = { version = "0.7.*", features = ["fullstack", "router"] }
dioxus-logger = "0.7.*"

uuid = { version = "1.*", features = ["serde", "v4", "js"] }
urlencoding = "2.*"
gloo-net = "0.6.*"
log = "0.4.*"

web-sys = { version = "0.3.*", features = ["Navigator", "Window"] }


webbrowser = "1.0"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "sync",
    "time",
] }
anyhow = "1"
getrandom = { version = "0.4.1", features = ["wasm_js"] }
url = "2.5"


[features]
default = []
server = ["dioxus/server"]
web = [
    "dioxus/web",
    "argentum_standard_ui/web",
    "argentum_user_account_ui/web",
    "argentum_user_account_rest/web",
    "argentum_user_account_rest/client",
]
