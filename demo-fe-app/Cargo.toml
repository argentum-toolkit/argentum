[package]
name = "demo-fe-app"
version = "0.1.0"
authors = ["Vital Leshchyk <vitalleshchyk@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
argentum_user_account_rest = { path = "../argentum_user_account/rest", version = ">=0.3.0-dev,<0.4.0" }
serde = { version = "1.0.197", features = ["derive"] }

dioxus = { version = "0.5", features = ["fullstack", "router"] }

# Debug
dioxus-logger = "0.5.*"
dioxus-sdk = { version = "0.5.*", features = ["storage"] }
manganis = "0.2.2"
tokio = "1.40.0"
reqwest = { version = "0.12", features = ["json"] }

[features]
default = []
server = ["dioxus/axum"]
web = ["dioxus/web"]
