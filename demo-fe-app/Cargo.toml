[package]
name = "demo-fe-app"
version = "0.1.0"
authors = ["Vital Leshchyk <vitalleshchyk@gmail.com>"]
edition = "2021"

[dependencies]
argentum_rest_infrastructure = { path = "../argentum_rest/infrastructure", version = ">=0.3.0-dev,<0.4.0" }
argentum_user_account_rest = { path = "../argentum_user_account/rest", version = ">=0.3.0-dev,<0.4.0", features = ["client"] }
serde = { version = "1.0.197", features = ["derive"] }

dioxus = { version = "0.5", features = ["fullstack", "router"] }

# Debug
dioxus-logger = "0.5.*"
dioxus-sdk = { version = "0.5.*", features = ["storage"] }
manganis = "0.2.2"
tokio = "1.40.0"

[features]
default = []
server = ["dioxus/axum"]
web = ["dioxus/web"]
