[package]
name = "demo-fe-app"
version = "0.3.0"
authors = ["Vital Leshchyk <vitalleshchyk@gmail.com>"]
edition = "2021"
resolver = "2"

[dependencies]
argentum_rest_infrastructure = { path = "../argentum_rest/infrastructure", version = ">=0.3.0-dev,<0.4.0"}
argentum_standard_business = { path = "../argentum_standard/business", version = ">=0.3.0-dev,<0.4.0" }
argentum_standard_infrastructure = { path = "../argentum_standard/infrastructure", version = ">=0.3.0-dev,<0.4.0" }
argentum_standard_ui = { path = "../argentum_standard/ui", version = ">=0.3.0-dev,<0.4.0", features = ["web"] }
argentum_user_account_rest = { path = "../argentum_user_account/rest", version = ">=0.3.0-dev,<0.4.0", features = ["client", "ui"] }
argentum_user_account_ui = { path = "../argentum_user_account/ui", version = ">=0.3.0-dev,<0.4.0", features = ["web"]}
argentum_user_rest = { path = "../argentum_user/rest", version = ">=0.3.0-dev,<0.4.0", features = ["client"] }
async-trait = "0.1.*"
serde = { version = "1.0.*", features = ["derive"] }
serde_json = "1.0.*"

dioxus = { version = "0.6.*", features = ["fullstack", "router"]}
dioxus-logger = "0.6.*"

uuid = { version = "1.*", features = ["serde", "v4", "js"] }
log = "0.4.*"

web-sys = { version = "0.3.*", features = [ "Navigator", "Window"] }


[features]
default = ["web"]
server = ["dioxus/server"]
web = ["dioxus/web", "argentum_standard_ui/web", "argentum_user_account_rest/client"]
