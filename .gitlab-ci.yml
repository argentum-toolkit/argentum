image: docker:latest

services:
  - name: docker:dind
    entrypoint: ["env", "-u", "DOCKER_HOST"]
    command: ["dockerd-entrypoint.sh"]

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  # See https://github.com/docker-library/docker/pull/166
  DOCKER_TLS_CERTDIR: ""
  BUILDER_IMAGE: itcreator/argentum-toolkit-rs-dev

before_script:
  - docker info
  - docker --version
  - docker compose version
  # Seed the local layer cache with the previously published image.
  - docker pull "${BUILDER_IMAGE}:latest" || true

stages:
  - build
  - check

build:
  stage: build
  script:
    # Rebuilds only the layers affected by Dockerfile changes;
    # a no-op (all layers cached) when the image is already up to date.
    - docker build --cache-from "${BUILDER_IMAGE}:latest" -t "${BUILDER_IMAGE}:latest" -f devops/docker/rust/Dockerfile .
    - docker compose run --rm builder devops/scripts/check.sh

check_cla:
  stage: check
  image: alpine:3.19
  before_script:
    - apk add --no-cache git
    - git fetch origin $CI_DEFAULT_BRANCH
  script:
    - |
      echo "Detecting commit authors compared to $CI_DEFAULT_BRANCH..."
      AUTHORS=$(git log origin/$CI_DEFAULT_BRANCH..HEAD --format="%ae" | sort -u)

      if [ -z "$AUTHORS" ]; then
        echo "No new authors detected. Skipping CLA check."
        exit 0
      fi

      echo "Authors detected:"
      echo "$AUTHORS"

      MISSING=0
      for EMAIL in $AUTHORS; do
        USERNAME=$(echo "$EMAIL" | sed 's/@.*//')
        CLA_FILE="cla-signatures/${USERNAME}.adoc"
        if [ ! -f "$CLA_FILE" ]; then
          echo "ERROR: CLA not signed for user $USERNAME ($EMAIL)"
          MISSING=$((MISSING+1))
        else
          echo "CLA found for $USERNAME ($EMAIL)"
        fi
      done

      if [ "$MISSING" -gt 0 ]; then
        echo "FAIL: $MISSING contributor(s) missing CLA signatures."
        exit 1
      fi
