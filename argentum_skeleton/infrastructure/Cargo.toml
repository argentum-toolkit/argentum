[package]
name = "argentum_skeleton_infrastructure"
description = "The infrastructure layer of skeleton component"
version = "0.4.0-dev"
authors = ["Vital Leshchyk <VitalLeshchyk@gmail.com>"]
license = "LGPL-3.0-or-later"
edition = "2024"
homepage = "https://gitlab.com/argentum-toolkit/argentum"
repository = "https://gitlab.com/argentum-toolkit/argentum"
documentation = "https://gitlab.com/argentum-toolkit/argentum"
readme = "README.md"

[dependencies]
argentum_db_infrastructure = { path = "../../argentum_db/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_encryption_business = { path = "../../argentum_encryption/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_encryption_infrastructure = { path = "../../argentum_encryption/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_event_business = { path = "../../argentum_event/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_notification_business = { path = "../../argentum_notification/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_notification_infrastructure = { path = "../../argentum_notification/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_rest_infrastructure = { path = "../../argentum_rest/infrastructure", version = ">=0.4.0-dev,<0.5.0", features = [
  "server",
] }
argentum_oidc_infrastructure = { path = "../../argentum_oidc/infrastructure", version = ">=0.4.0-dev,<0.5.0", features = [
  "server",
] }
argentum_oidc_rest = { path = "../../argentum_oidc/rest", version = ">=0.4.0-dev,<0.5.0", features = [
  "server",
] }
argentum_standard_business = { path = "../../argentum_standard/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_standard_infrastructure = { path = "../../argentum_standard/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_user_business = { path = "../../argentum_user/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_user_infrastructure = { path = "../../argentum_user/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_user_rest = { path = "../../argentum_user/rest", version = ">=0.4.0-dev,<0.5.0" }
argentum_user_account_business = { path = "../../argentum_user_account/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_user_account_infrastructure = { path = "../../argentum_user_account/infrastructure", version = ">=0.4.0-dev,<0.5.0" }
argentum_user_account_rest = { path = "../../argentum_user_account/rest", version = ">=0.4.0-dev,<0.5.0" }
argentum_log_business = { path = "../../argentum_log/business", version = ">=0.4.0-dev,<0.5.0" }
argentum_log_infrastructure = { path = "../../argentum_log/infrastructure", version = ">=0.4.0-dev,<0.5.0" }


envy = "0.4.*"
reqwest = { version = "0.12.*", features = ["json"] }

serde = { version = "1.*", features = ["derive"] }
sqlx = { version = "0.8.*", features = [
  "runtime-tokio",
  "tls-native-tls",
  "postgres",
  "uuid",
  "any",
  "chrono",
] }

tokio = { version = "1.*", features = ["full"] }
